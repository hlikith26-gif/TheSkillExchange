<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="main.css">
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
</head>
<body>
   
    <div class="container">
    <aside class="sidebar">
        <ul>
            <a href="main.html"><li>Dashboard</li></a>
            <a href="lr.html"><li>Learning Resources</li></a>
            <a href="forums.html" ><li>Forums</li></a>
            <a href="main.html" data-page="tools"><li>Tools</li></a>
            <a href="events.html"><li>Events</li></a>
            <button class="btn-primary" onclick="feedback_show()">Feedback</button>
            <button id="themeToggle" class="btn-primary">
                ☀️ Light Mode
            </button>
            <button class="btn-logout" onclick="logoutconf()">Log Out</button>
        </ul>
    </aside>


        <dialog id="conf-popup">
            <p>Are you sure you want to log out?</p>
            <button onclick="conf_close()">NO, NEVER</button>
            <button id="logoutBtn" class="btn-logout">Yes</button>
        </dialog>

        <main id="main-content">
            <h1>Dashboard</h1>
            <h1 class="title" >Welcome, <span class="bluestuff">Friend</span></h1>
            <p id="nameDis"></p>
        </main>



        
        <template id="page-tools">
            <h1>Tools</h1>
            <div class="tools">
                <div class="tool">
                    <h1>Powerer</h1>
                    <i style="margin-bottom: 15px;">Raise any number to any power: </i><br>
                    <input placeholder="Base Number" id="bsno">
                    <input placeholder="Power" id="pwno">
                    <p id="pdisplay"></p><br>
                    <button class="btn-primary" onclick="powerer()">Calculate</button>
                    <p>Result: <span id="r">0</span></p>
                </div>
            </div>
        </template>
    <script>
             function powerer() {
            var base = document.getElementById("bsno").value;
            var power = document.getElementById("pwno").value;
            var result = Math.pow(Number(base), Number(power));
            document.getElementById("r").textContent = result;
        }
    </script>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js"></script>
    <script src="forums.js"></script>
    <script src="other.js"></script>

</body>
</html>
