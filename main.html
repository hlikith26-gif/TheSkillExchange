<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="main.css">
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
</head>
<body>
    <div class="container">
    <aside class="sidebar">
        <ul>
            <a href="#" data-page="home"><li>Home</li></a>
            <a href="#" data-page="lr"><li>Learning Resources</li></a>
            <a href="#" data-page="threads"><li>Threads</li></a>
            <a href="#" data-page="events"><li>Events</li></a>
            <a href="#" data-page="tools"><li>Tools</li></a>
            <button class="btn-primary" onclick="feedback_show()">Feedback</button>
        </ul>
    </aside>

        <dialog id="feedback-popup" style="border-radius: 16px;">
            <h1>Feedback</h1>
            <form>
                <input placeholder="Message" style="min-height: 100px;" type="file"><br>
                <button class="btn-primary" style="margin-top: 25px; margin-right: 25px;">Submit</button>
                <button class="button-outline" onclick="close_feedback()">Cancel</button>
            </form>
        </dialog>

        <dialog id="media-popup">
            <h1>Upload Media</h1>
            <input type="file" accept=".mp4, .mp3, .mkv, .webm, .wav">
            <select id="genre">
                <option value="mathematics">Mathematics</option>
                <option value="phy">Physics</option>
                <option value="chem">Chemistry</option>
                <option value="bio">Biology</option>
                <option value="his">History</option>
                <option value="geo">Geography</option>
                <option value="civ">Civics</option>
                <option value="cs">Computer Science</option>
                <option value="law">Law</option>
                <option value="fl">Financial Literacy</option>
                <option value="languages">Languages</option>
                <option value="others">Others</option>
            </select>
            <button>Publish</button>
            <button onclick="publish_back()">Back</button>
            <button onclick="media_close()">Close</button>
        </dialog>

        <dialog id="of-popup">
            <h1>Upload Files</h1>
            <input type="file" accept=".png, .jpg, .pdf, .txt">
            <select id="genre">
                <option value="mathematics">Mathematics</option>
                <option value="phy">Physics</option>
                <option value="chem">Chemistry</option>
                <option value="bio">Biology</option>
                <option value="his">History</option>
                <option value="geo">Geography</option>
                <option value="civ">Civics</option>
                <option value="cs">Computer Science</option>
                <option value="law">Law</option>
                <option value="fl">Financial Literacy</option>
                <option value="languages">Languages</option>
                <option value="others">Others</option>
            </select>
            <button>Publish</button>
            <button onclick="publish_back_of()">Back</button>
            <button onclick="of_close()">Close</button>
        </dialog>

        <dialog id="publish-popup">
            <div class="publishpopup">
                <div class="publishpopuppurple" onclick="media_show()">
                    <h1 class="publishpopuptitle">Upload Media</h1>
                    <p>MP4, MKV, WebM, MP3, WAV</p>
                </div>

                <div class="publishpopupblue" onclick="others_show()">
                    <h1 class="publishpopuptitle">Upload Others</h1>
                    <p>PNG, JPEG, PDF, TXT</p>
                </div>                
            </div>
            <button onclick="close_publish()" class="btn-outline" style="margin-top: 15px; text-align: center;">Close</button>
        </dialog>


        <main id="main-content">
            <h1>Dashboard</h1>
            <h1 class="title">Welcome,</h1>
            
        </main>


        <template id="page-home">
            <h1>Dashboard</h1>
            <h1 class="title">Welcome,</h1>
        </template>

        <template id="page-lr">
            <h1>Learning Resources</h1>
            <button class="btn-primary" onclick="publish_show()">Publish</button>
        </template>

        <template id="page-threads">
            <h1>Threads</h1>
        </template>
        
        <template id="page-events">
            <h1>Events</h1>
        </template>
        
        <template id="page-tools">
            <h1>Tools</h1>
            <div class="tools">
                <div class="tool">
                    <h1>Powerer</h1>
                    <i style="margin-bottom: 15px;">Raise any number to any power: </i><br>
                    <input placeholder="Base Number" id="bsno">
                    <input placeholder="Power" id="pwno">
                    <p id="pdisplay"></p><br>
                    <button class="btn-primary" py-click="powerer">Calculate</button>
                </div>
            </div>
        </template>


    </div>
    <script src="other.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="dashboard.js"></script>
    <script src="other.js"></script>
    <py-script src="main.py"></py-script>
</body>
</html>
