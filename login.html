<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
  <section class="hero">
    <div class="hero-bg"></div>

    <div class="hero-content">
      <div class="hero-tagline">
        <div class="card">
          <h1>Login</h1>
          <form id="loginForm">

            <label class="form" for="Email2">Email:</label>
            <input type="email" id="Email2" name="Email" required><br><br>

            <label class="form" for="password2">Password:</label>
            <input type="password" id="password2" name="password" required><br><br>

            <button type="submit" class="btn-primary">
              Login
            </button>
            <a href="signup.html"><p class="bluetext">Don't Have An Account?</p></a>
          </form>
          <a href="index.html"><button class="btn-outline" style="margin-top: 20px;">Back</button></a>
        </div>  
    </div>
  </section>
  <a href="index.html"><button>Back</button></a>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="script.js"></script>
</body>
