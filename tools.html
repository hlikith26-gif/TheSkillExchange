<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="main.css">
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
</head>
<body>
   
    <div class="container">
    <aside class="sidebar">
        <ul>
            <a href="main.html"><li>Dashboard</li></a>
            <a href="lr.html"><li>Learning Resources</li></a>
            <a href="forums.html" ><li>Forums</li></a>
            <a href="tools.html"><li>Tools</li></a>
            <a href="events.html"><li>Events</li></a>
            <button class="btn-primary" onclick="feedback_show()">Feedback</button>
            <button class="btn-logout" onclick="logoutconf()">Log Out</button>
        </ul>
    </aside>


        <dialog id="conf-popup">
            <p>Are you sure you want to log out?</p>
            <button onclick="conf_close()">NO, NEVER</button>
            <button id="logoutBtn" class="btn-logout">Yes</button>
        </dialog>



        
        <main id="page-tools">
            <h1>Tools</h1>
            <div class="tools">
                <div class="tool">
                    <h1>Powerer</h1>
                    <i style="margin-bottom: 15px;">Raise any number to any power: </i><br>
                    <input placeholder="Base Number" id="bsno">
                    <input placeholder="Power" id="pwno">
                    <p id="pdisplay"></p><br>
                    <button class="btn-primary" py-click="powerer">Calculate</button>

                </div>
                <div class="tool">
                    <h1>Square Root</h1>
                    <input placeholder="Enter Number" id="nsq1">
                    <p id="sqdisplay"></p>
                    <button class="btn-primary" py-click="sqroot">Calculate</button>
                </div>
                <div class="tool">
                    <h1>Cube Root</h1>
                    <input placeholder="Enter Number" id="ncu1">
                    <p id="cudisplay"></p>
                    <button class="btn-primary" py-click="curoot">Calculate</button>
                </div>
            </div>
        </template>

    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js"></script>
    <script src="forums.js"></script>
    <script src="other.js"></script>
    <py-script src="main.py"></py-script>

</body>
</html>
