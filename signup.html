<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <script src="https://cdn.jsdelivr.net/npm/appwrite@17.0.0"></script>
    <script src="script.js"></script>
    <section class="hero">
        <div class="hero-bg"></div>

        <div class="hero-content">
            <div class="hero-tagline">
                <div class="card">

                    <h1>Sign Up</h1>

                    <form id="signupForm">

                        <label class="form" for="name">Name:</label>
                        <input type="text" id="name" name="name" required>
                        <br><br>

                        <label class="form" for="email">Email:</label>
                        <input type="email" id="email" name="email" required>
                        <br><br>

                        <label class="form" for="password">Password:</label>
                        <input type="password" id="password" name="password" required>
                        <br><br>

                        <label class="form" for="confirmPassword">
                            Confirm Password:
                        </label>

                        <input
                            type="password"
                            id="confirmPassword"
                            name="confirmPassword"
                            required
                        >
                        <br><br>

                        <button type="submit" class="btn-primary">
                            Sign Up
                        </button>

                        <a href="login.html">
                            <p class="bluetext">Already Have an account?</p>
                        </a>

                    </form>

                    <a href="index.html">
                        <button type="button" class="btn-outline" style="margin-top: 20px;">
                            Back
                        </button>
                    </a>

                </div>
            </div>
        </div>
    </section>

    <!-- Appwrite -->
    <script src="https://cdn.jsdelivr.net/npm/appwrite@17.0.0"></script>

    <!-- Your JavaScript -->
    <script src="script.js"></script>

</body>
</html>
